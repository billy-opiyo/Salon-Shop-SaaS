<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#17120c" />
		<title>Connection interrupted · Beauty Sphia</title>
		<style>
			:root {
				color-scheme: dark;
				--background: #17120c;
				--surface: #251b10;
				--text-primary: #fff8e8;
				--text-secondary: #c8bda8;
				--primary: #d7a84f;
				--primary-light: #f1d59b;
				--primary-contrast: #17110a;
				--primary-border: color-mix(in srgb, var(--primary) 34%, transparent);
				--primary-soft: color-mix(in srgb, var(--primary) 12%, transparent);
				--font-heading: Georgia, serif;
				--font-body: system-ui, sans-serif;
			}
			* { box-sizing: border-box; }
			body {
				min-height: 100vh;
				min-height: 100dvh;
				margin: 0;
				background: var(--background);
				color: var(--text-primary);
				font: 16px/1.55 var(--font-body);
			}
			.offline-notice {
				position: fixed;
				inset: 0;
				z-index: 1;
				display: grid;
				place-items: center;
				padding: max(1rem, env(safe-area-inset-top, 0px)) 1rem max(1rem, env(safe-area-inset-bottom, 0px));
				background: rgba(6, 5, 4, .76);
				-webkit-backdrop-filter: blur(8px);
				backdrop-filter: blur(8px);
			}
			.offline-notice__dialog {
				width: min(100%, 26rem);
				padding: clamp(1.5rem, 5vw, 2.25rem);
				border: 1px solid var(--primary-border);
				border-radius: 1.5rem;
				background: var(--surface);
				box-shadow: 0 2rem 6rem rgba(0, 0, 0, .42), 0 1px 0 rgba(255, 248, 232, .06) inset;
				text-align: center;
			}
			.offline-notice__icon {
				display: grid;
				width: 4.25rem;
				height: 4.25rem;
				margin: 0 auto 1.15rem;
				place-items: center;
				border: 1px solid var(--primary-border);
				border-radius: 50%;
				background: var(--primary-soft);
				color: var(--primary-light);
			}
			.offline-notice__icon svg { width: 30px; height: 30px; }
			.offline-notice__eyebrow {
				margin: 0 0 .5rem;
				color: var(--primary-light);
				font-size: .74rem;
				font-weight: 700;
				letter-spacing: .16em;
				text-transform: uppercase;
			}
			.offline-notice__dialog h1 {
				margin: 0 0 .75rem;
				font: 600 clamp(1.55rem, 5vw, 2rem)/1.15 var(--font-heading);
			}
			.offline-notice__description {
				max-width: 34ch;
				margin: 0 auto 1.5rem;
				color: var(--text-secondary);
				font-size: .95rem;
				line-height: 1.65;
			}
			.offline-notice__retry {
				min-height: 2.9rem;
				padding: .75rem 1.4rem;
				border: 1px solid var(--primary-border);
				border-radius: 999px;
				background: var(--primary);
				color: var(--primary-contrast);
				font: 700 .92rem/1 var(--font-body);
				cursor: pointer;
				transition: filter .18s ease, transform .18s ease;
			}
			.offline-notice__retry:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
			.offline-notice__retry:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 3px; }
			.offline-notice__retry:disabled { cursor: wait; opacity: .75; }
			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after { transition-duration: .01ms !important; }
			}
		</style>
	</head>
	<body>
		<div class="offline-notice" role="presentation">
			<main class="offline-notice__dialog" role="alertdialog" aria-modal="true" aria-labelledby="offline-title" aria-describedby="offline-description">
				<div class="offline-notice__icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 9a15 15 0 0 1 18 0M6.5 12.5a9.5 9.5 0 0 1 11 0M10 16a4 4 0 0 1 4 0M12 20h.01" />
						<path d="m3 3 18 18" />
					</svg>
				</div>
				<p class="offline-notice__eyebrow">Connection interrupted</p>
				<h1 id="offline-title">Internet unavailable</h1>
				<p class="offline-notice__description" id="offline-description">Beauty Sphia needs an internet connection to keep your salon experience up to date. Check your Wi-Fi or mobile data, then try again.</p>
				<button class="offline-notice__retry" id="retry" type="button">Try again</button>
			</main>
		</div>
		<script>
			(() => {
				const query = new URLSearchParams(location.search)
				const colors = {
					background: "--background",
					surface: "--surface",
					text: "--text-primary",
					muted: "--text-secondary",
					primary: "--primary",
				}
				for (const [key, variable] of Object.entries(colors)) {
					const value = query.get(key)
					if (value && /^#[0-9a-f]{6}$/i.test(value)) document.documentElement.style.setProperty(variable, value)
				}

				const failedUrl = query.get("url")
				const retryButton = document.getElementById("retry")
				let checking = false
				async function retry() {
					if (checking || !failedUrl || !navigator.onLine) return
					checking = true
					retryButton.disabled = true
					retryButton.textContent = "Checking connection..."
					try {
						await fetch(failedUrl, { method: "HEAD", mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(5000) })
						location.replace(failedUrl)
					} catch {
						retryButton.textContent = "Try again"
					} finally {
						checking = false
						retryButton.disabled = false
					}
				}
				retryButton.addEventListener("click", retry)
				addEventListener("online", retry)
				addEventListener("pageshow", retry)
				setInterval(retry, 3000)
			})()
		</script>
	</body>
</html>
